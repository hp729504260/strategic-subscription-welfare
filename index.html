<script id="model">
"use strict";
const Model=(()=>{
 const bisect=(fn,lo,hi)=>{let flo=fn(lo);for(let i=0;i<65;i++){const mid=(lo+hi)/2,fm=fn(mid);if(fm===0)return mid;if((fm>0)===(flo>0)){lo=mid;flo=fm}else hi=mid}return (lo+hi)/2};
 function context(b,tau,mu){
  const beta0=bisect(x=>tau*x**3+mu*x-mu,0,1),b0=beta0**2,D0=mu+b0*tau;
  const betaW=bisect(x=>tau*x**4+mu*x-mu,0,1),cmu=b*b0/D0**2,ctheta=b0**2/D0**2;
  const cw=b*((1-betaW)/(tau*betaW))**2,cm=b<1?(1-Math.sqrt(b))**2/tau**2:null,cf=b<1?b**3/mu**2:null;
  const knife=Math.abs(b-b0)<2e-13,group=knife?'knife':b>=1?'high':b>b0?'middle':'low';
  const activation=Math.max(cmu,ctheta),transition=group==='middle'?cm:group==='low'?cf:group==='knife'?activation:null;
  const star=group==='high'?cw:group==='middle'?Math.max(cw,cm):null;
  return {b,tau,mu,beta0,b0,D0,W0:-b0/D0,cmu,ctheta,cw,cm,cf,activation,transition,star,group,betaW,bw:betaW**2};
 }
 function finish(c,q,beta,kt,km,regime){
  kt=Math.max(0,kt);km=Math.max(0,km);const D=q.mu+q.b*km+beta**2*(q.tau+kt),loss=beta**2/D;
  const db=regime==='m'?-beta*(1-beta)/(2*c):regime==='f'?beta/(6*c):0;
  const direct=kt+km,strategic=2*beta*(q.mu+q.b*km)/D**2*db;
  return {beta,kt,km,regime,loss,W:-loss-c*(kt+km),dW:-direct-strategic,direct,strategic,db};
 }
 function equilibrium(c,q){
  if(!(c>0))throw new RangeError('c must be positive');
  if(c>=q.activation)return finish(c,q,q.beta0,0,0,'n');
  if(q.group==='high'||(q.group==='middle'&&c>q.cm)){
   const r=Math.sqrt(q.b/c),beta=r/(q.tau+r);return finish(c,q,beta,0,(r*beta**2-q.mu)/q.b,'m');
  }
  if(q.group==='low'&&c>q.cf){const beta=Math.cbrt(q.mu*Math.sqrt(c));return finish(c,q,beta,(1-beta)/Math.sqrt(c)-q.tau,0,'f')}
  return finish(c,q,Math.sqrt(q.b),(1-Math.sqrt(q.b))/Math.sqrt(c)-q.tau,Math.sqrt(q.b/c)-q.mu/q.b,'j');
 }
 function planner(c,q){
  const den=3-2*q.beta0,at=3*q.ctheta/den,am=q.cmu/den;
  if(c>=Math.max(at,am))return finish(c,q,q.beta0,0,0,'n');
  if(q.b<3){const be=Math.sqrt(q.b/3),s=Math.sqrt(3/((3-2*be)*c)),kt=(1-be)*s-q.tau,km=(be**3*s-q.mu)/q.b;
   if(kt>=-1e-10&&km>=-1e-10)return finish(c,q,be,kt,km,'j');
  }
  if(am>at){const be=bisect(x=>q.b*(1-x)**2/(x*x*q.tau*q.tau*(3-2*x))-c,q.beta0,1),p=be**3*q.tau/(1-be);return finish(c,q,be,0,(p-q.mu)/q.b,'m')}
  const be=bisect(x=>3*x**6/(q.mu*q.mu*(3-2*x))-c,0,q.beta0),t=q.mu*(1-be)/be**3;return finish(c,q,be,t-q.tau,0,'f');
 }
 return {bisect,context,equilibrium,planner};
})();
</script>

<script id="interface">
const $=id=>document.getElementById(id),clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const palette={n:'#727e91',m:'#a66a1d',f:'#3564b7',j:'#177a64'},fills={n:'#eff1f5',m:'#fff0d9',f:'#e3ecfc',j:'#e0f2ec'};
const names={n:'No Learning',m:'Only Preference',f:'Only Fundamental',j:'Both'};
const state={b:.49,tau:1,mu:.25,c:.32,planner:false,candidates:false};
let q,domain,samples,frame=0,dirty=true,playing=false,lastTime=0,playFraction=0;
const plotClones=[];
const fmt=(v,n=4)=>{if(!Number.isFinite(v))return '—';if(Math.abs(v)<1e-13)return '0';if(Math.abs(v)<.0001||Math.abs(v)>=10000)return v.toExponential(2);return Number(v.toFixed(n)).toString()};
const near=(a,b)=>b!==null&&Math.abs(a-b)<=2e-10*Math.max(1e-9,Math.abs(b));
function windowFor(z){const pa=Math.max(z.cmu,3*z.ctheta)/(3-2*z.beta0),small=z.transition!==null?z.transition:z.cw;return {hi:Math.max(z.activation,pa)*1.8,lo:Math.max(1e-12,Math.min(z.activation/7,small/4))}}
const cAt=(u,d=domain)=>Math.exp(Math.log(d.lo)+u*Math.log(d.hi/d.lo));
const fraction=(c,d=domain)=>Math.log(c/d.lo)/Math.log(d.hi/d.lo);
function requestRender(full=false){dirty=dirty||full;if(!frame)frame=requestAnimationFrame(()=>{frame=0;render()})}
function stopPlay(){playing=false;$('play').textContent='▶';$('play').setAttribute('aria-label','Play c increase');$('play').title='Play c increase';syncPlotControls()}
function setParameters(values){Object.assign(state,values);$('inputError').textContent='';stopPlay();requestRender(true)}
function regenerate(){q=Model.context(state.b,state.tau,state.mu);domain=windowFor(q);domain.hi=Math.max(domain.hi,state.c*1.001);domain.lo=Math.min(domain.lo,state.c/1.001);const cs=Array.from({length:321},(_,i)=>cAt(i/320));[q.activation,q.transition,q.star].filter(c=>c&&c>=domain.lo&&c<=domain.hi).forEach(c=>cs.push(c));cs.sort((a,b)=>a-b);samples=cs.map(c=>({c,d:Model.equilibrium(c,q),p:Model.planner(c,q)}))}
function text(x,y,value,attrs=''){return '<text x="'+x+'" y="'+y+'" '+attrs+'>'+value+'</text>'}
function line(x1,y1,x2,y2,color='#e8ebf0',extra=''){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" '+extra+'/>'}
function circle(x,y,r,fill,stroke){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>'}
function path(points,x,y,key){return points.map((p,i)=>(i?'L':'M')+x(p.c).toFixed(2)+','+y(key(p)).toFixed(2)).join(' ')}
function geometry(id){const r=$(id).getBoundingClientRect(),w=Math.max(270,r.width),h=r.height;return {w,h,l:70,r:14,t:64,pw:w-84,ph:h-93}}
function thresholds(withMinimum=false){
 const items=[{c:q.activation,symbol:q.group==='knife'?'c⁰':q.group==='low'?'cθ⁰':'cμ⁰',type:'activation',meaning:q.group==='knife'?'Both cutoff':'Learning cutoff'}];
 if(q.transition!==null&&!near(q.transition,q.activation))items.push({c:q.transition,symbol:q.group==='middle'?'cᴹ':'cᶠ',type:'transition',meaning:'Both cutoff'});
 if(withMinimum&&q.star){const same=items.find(v=>near(v.c,q.star));if(same){same.symbol+=' = c*';same.minimum=true;same.meaning='Both cutoff / Minimum'}else items.push({c:q.star,symbol:q.group==='high'?'cᵂ':'c*',type:'minimum',minimum:true,meaning:'Welfare minimum'})}
 return items.sort((a,b)=>a.c-b.c);
}
function bands(g,x){
 const cuts=thresholds().map(v=>v.c).filter(c=>c<domain.hi&&c>domain.lo),edges=[domain.lo,...cuts,domain.hi].sort((a,b)=>a-b);
 let s='',labels=[];const font=g.w<400?12:13;
 for(let i=0;i<edges.length-1;i++){const a=x(edges[i]),b=x(edges[i+1]),reg=Model.equilibrium(Math.sqrt(edges[i]*edges[i+1]),q).regime,anchor=(a+b)/2,width=names[reg].length*font*.53; s+='<rect x="'+a+'" y="'+g.t+'" width="'+Math.max(0,b-a)+'" height="'+g.ph+'" fill="'+fills[reg]+'"/>';labels.push({anchor,pos:anchor,width,reg})}
 let right=g.l-7;for(const z of labels){z.pos=Math.max(z.anchor,right+7+z.width/2);right=z.pos+z.width/2}
 let left=g.w-g.r+7;for(let i=labels.length-1;i>=0;i--){const z=labels[i];z.pos=Math.min(z.pos,left-7-z.width/2);left=z.pos-z.width/2}
 for(const z of labels){if(Math.abs(z.pos-z.anchor)>5)s+=line(z.pos,26,z.anchor,34,palette[z.reg],'opacity=".5"');s+=text(z.pos,20,names[z.reg],'text-anchor="middle" style="fill:'+palette[z.reg]+';font-size:'+font+'px"')}
 return s;
}
function axisX(g){return '<g class="x-axis">'+line(g.l,g.t+g.ph,g.w-g.r,g.t+g.ph,'#b9c2cf','stroke-width=".7"')+text(g.w-g.r,g.h-6,'c','class="symbol" text-anchor="end"')+'</g>'}
function axisY(g,label,description){const cy=g.t+g.ph/2;return line(g.l,g.t,g.l,g.t+g.ph,'#b9c2cf','stroke-width=".7"')+text(14,cy,label,'class="symbol y-axis-title" text-anchor="middle" transform="rotate(-90 14 '+cy+')" aria-label="'+description+'"')}
function boundaryLines(g,x,withMinimum){let s='',previous=-Infinity,row=0;for(const z of thresholds(withMinimum)){const xx=x(z.c);row=xx-previous<53?1-row:0;previous=xx;s+=line(xx,g.t,xx,g.t+g.ph,z.minimum?'#c57b7f':'#9daaba','stroke-dasharray="3 4" stroke-width=".8"');s+=text(xx,43+row*15,z.symbol,'class="symbol" text-anchor="middle" style="fill:'+(z.minimum?'#b84248':'#65758c')+'"')}return s}
function nodeShape(z,xx,yy){
 if(z.minimum)return circle(xx,yy,4.6,'#bf4147','#fff');
 if(z.type==='transition')return '<polygon points="'+xx+','+(yy-5)+' '+(xx+5)+','+yy+' '+xx+','+(yy+5)+' '+(xx-5)+','+yy+'" fill="white" stroke="#536780" stroke-width="1.5"/>';
 return circle(xx,yy,4.1,'white','#536780');
}
function nodeMarks(g,x,y,withMinimum,key){let s='';for(const z of thresholds(withMinimum)){const e=Model.equilibrium(z.c,q);s+='<g><title>'+z.symbol+': '+z.meaning+'; c = '+fmt(z.c,6)+'</title>'+nodeShape(z,x(z.c),y(key(e)))+'</g>'}return s}
function nodeButtons(id,withMinimum){$(id).innerHTML=thresholds(withMinimum).map(z=>'<button type="button" class="node-button" data-cost="'+z.c+'" title="'+z.symbol+' = '+fmt(z.c,6)+'" aria-label="'+z.symbol+': '+z.meaning+', c = '+fmt(z.c,6)+'"><span class="node-icon '+(z.minimum?'minimum':'')+'">'+(z.minimum?'●':z.type==='transition'?'◇':'○')+'</span><span class="symbol '+(z.minimum?'minimum':'')+'">'+z.symbol+'</span> '+z.meaning+'</button>').join('')}
function plotFinish(id,g,s){const el=$(id);el.setAttribute('viewBox','0 0 '+g.w+' '+g.h);el.innerHTML=s;Object.assign(el.dataset,{left:g.l,plotwidth:g.pw})}
function drawWelfare(){
 const g=geometry('welfareChart'),x=c=>g.l+g.pw*fraction(c),values=samples.flatMap(s=>state.planner?[s.d.W-q.W0,s.p.W-q.W0]:[s.d.W-q.W0]);let lo=Math.min(0,...values),hi=Math.max(0,...values),span=Math.max(hi-lo,Math.abs(q.W0)*.06);lo-=span*.14;hi+=span*.16;const y=v=>g.t+g.ph*(hi-v)/(hi-lo),e=Model.equilibrium(state.c,q);
 let s='<defs><clipPath id="wclip"><rect x="'+g.l+'" y="'+g.t+'" width="'+g.pw+'" height="'+g.ph+'"/></clipPath></defs>'+bands(g,x);
 const rawStep=(hi-lo)/4,power=10**Math.floor(Math.log10(rawStep)),step=[1,2,5,10].find(v=>v>=rawStep/power)*power;
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const yy=y(v);s+=line(g.l,yy,g.w-g.r,yy,'#e4e8ee','stroke-width=".7"')+text(g.l-8,yy+4,fmt(v,3),'text-anchor="end"')}
 const label='<tspan style="fill:#2457c5">Wᵈ − W₀</tspan>'+(state.planner?'<tspan style="fill:#087d78">, Wˢᵒ − W₀</tspan>':'');
 s+=axisX(g)+axisY(g,label,state.planner?'Consumer and planner welfare relative to the no-learning baseline':'Consumer welfare relative to the no-learning baseline')+boundaryLines(g,x,true)+line(g.l,y(0),g.w-g.r,y(0),'#8e98a8','stroke-dasharray="2 4" stroke-width="1"');
 if(state.planner)s+='<path d="'+path(samples,x,y,p=>p.p.W-q.W0)+'" fill="none" stroke="#087d78" stroke-width="2" stroke-dasharray="7 5" clip-path="url(#wclip)"/>';
 s+='<path d="'+path(samples,x,y,p=>p.d.W-q.W0)+'" fill="none" stroke="#2457c5" stroke-width="2.7" stroke-linejoin="round" clip-path="url(#wclip)"/>';
 s+=line(x(state.c),g.t,x(state.c),g.t+g.ph,'#344662','opacity=".55" stroke-width=".8"')+circle(x(state.c),y(e.W-q.W0),4.5,'#2457c5','white');
 s+=nodeMarks(g,x,y,true,z=>z.W-q.W0);plotFinish('welfareChart',g,s);
}
function drawBeta(){
 const g=geometry('betaChart'),x=c=>g.l+g.pw*fraction(c),y=v=>g.t+g.ph*(1.04-v)/1.04,e=Model.equilibrium(state.c,q);
 let s='<defs><clipPath id="bclip"><rect x="'+g.l+'" y="'+g.t+'" width="'+g.pw+'" height="'+g.ph+'"/></clipPath></defs>'+bands(g,x);
 for(const v of [0,.5,1]){s+=line(g.l,y(v),g.w-g.r,y(v),'#e4e8ee','stroke-width=".7"');if(Math.abs(y(v)-y(q.beta0))>18)s+=text(g.l-8,y(v)+4,fmt(v,2),'text-anchor="end"')}
 s+=axisX(g)+axisY(g,'<tspan style="fill:#1b293f">βᵈ</tspan>','Equilibrium manipulation beta d')+boundaryLines(g,x,false)+line(g.l,y(q.beta0),g.w-g.r,y(q.beta0),'#8e98a8','stroke-dasharray="2 4"');
 s+=text(g.l-8,y(q.beta0)+4,'β<tspan baseline-shift="sub" font-size="10" font-style="normal">0</tspan>','class="symbol baseline-label" text-anchor="end" aria-label="beta zero"');
 if(state.candidates){
  const candidates=[{key:p=>Math.sqrt(q.b)/(q.tau*Math.sqrt(p.c)+Math.sqrt(q.b)),color:'#ad630f',dash:'7 4'},{key:p=>Math.cbrt(q.mu*Math.sqrt(p.c)),color:'#4272ce',dash:'2 4'},{key:()=>Math.sqrt(q.b),color:'#087d78',dash:'9 3 2 3'}];
  for(const z of candidates)s+='<path d="'+path(samples,x,y,z.key)+'" fill="none" stroke="'+z.color+'" stroke-width="1.4" stroke-dasharray="'+z.dash+'" opacity=".8" clip-path="url(#bclip)"/>';
  if(q.b>=1)s+=text(g.w-g.r-6,g.t+16,'√b ≥ 1: Both infeasible','text-anchor="end" style="fill:#087d78;font-size:12px"');
 }
 s+='<path d="'+path(samples,x,y,p=>p.d.beta)+'" fill="none" stroke="#1b293f" stroke-width="2.7" clip-path="url(#bclip)"/>';
 s+=line(x(state.c),g.t,x(state.c),g.t+g.ph,'#344662','opacity=".55" stroke-width=".8"')+circle(x(state.c),y(e.beta),4.5,'#1b293f','white');
 s+=nodeMarks(g,x,y,false,z=>z.beta);plotFinish('betaChart',g,s);
}
function phaseWindow(){return {hi:Math.max(state.c*1.001,2*q.b0/q.D0**2*1.8,3*q.ctheta/(3-2*q.beta0)*1.8),lo:Math.min(state.c/1.001,q.ctheta/80,.02**3/q.mu**2/3)}}
function drawPhase(){
 const id='phaseChart',rect=$(id).getBoundingClientRect(),w=Math.max(270,rect.width),h=rect.height,l=58,r=14,t=40,pw=w-l-r,ph=h-t-35,pd=phaseWindow(),x=b=>l+(b-.02)/1.98*pw,y=c=>t+ph*(1-fraction(c,pd));
 let s='<defs><clipPath id="pclip"><rect x="'+l+'" y="'+t+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs><rect x="'+l+'" y="'+t+'" width="'+pw+'" height="'+ph+'" fill="'+fills.n+'"/><g clip-path="url(#pclip)">';
 const pieces=[{lo:.02,hi:Math.min(q.b0,2),reg:'f'},{lo:Math.max(q.b0,.02),hi:1,reg:'m'},{lo:1,hi:2,reg:'m'}];
 const area=(a,b,color)=>'<path d="M'+a.map(p=>x(p[0])+','+y(clamp(p[1],pd.lo,pd.hi))).join(' L')+' L'+b.slice().reverse().map(p=>x(p[0])+','+y(clamp(p[1],pd.lo,pd.hi))).join(' L')+' Z" fill="'+color+'"/>';
 for(const z of pieces){if(z.hi<=z.lo)continue;const top=[],bottom=[],floor=[];for(let i=0;i<=100;i++){const b=z.lo+(z.hi-z.lo)*i/100,act=Math.max(q.ctheta,b*q.b0/q.D0**2),tr=b>=1?pd.lo:b>=q.b0?(1-Math.sqrt(b))**2/q.tau**2:b**3/q.mu**2;top.push([b,act]);bottom.push([b,Math.max(tr,1e-30)]);floor.push([b,pd.lo])}s+=area(top,bottom,fills[z.reg]);if(z.hi<=1)s+=area(bottom,floor,fills.j)}
 for(const b of[q.b0,1])s+=line(x(b),t,x(b),h-35,'#70849a','stroke-dasharray="3 5" stroke-width=".8"');
 s+=circle(x(state.b),y(state.c),5.5,'#1b293f','white')+'</g>';
 for(let i=0;i<=3;i++){const c=cAt(i/3,pd);s+=text(l-8,y(c)+4,fmt(c,3),'text-anchor="end"')}
 s+='<g class="x-axis">'+line(l,t+ph,w-r,t+ph,'#b9c2cf','stroke-width=".7"')+text(w-r,h-12,'b','class="symbol" text-anchor="end"')+'</g>';
 s+=text(x(q.b0),28,'<tspan>β</tspan><tspan dy="4" font-size="11" font-style="normal" font-family="Cambria Math, Times New Roman, serif">0</tspan><tspan dx="-5.5" dy="-11" font-size="11" font-style="normal">2</tspan><tspan dy="7" font-style="normal"> = '+fmt(q.b0,3)+'</tspan>','class="symbol" text-anchor="middle" aria-label="beta zero squared = '+fmt(q.b0,3)+'"')+text(x(1),28,'b = 1','class="symbol" text-anchor="middle"')+text(l,11,'c','class="symbol"');
 $(id).setAttribute('viewBox','0 0 '+w+' '+h);$(id).innerHTML=s;Object.assign($(id).dataset,{left:l,plotwidth:pw,top:t,plotheight:ph});
}
function renderControls(){
 for(const key of['b','tau','mu']){if(document.activeElement!==$(key+'Number'))$(key+'Number').value=fmt(state[key],5);$(key+'Slider').value=state[key]}
 if(document.activeElement!==$('cNumber'))$('cNumber').value=fmt(state.c,5);
 $('cSlider').value=clamp(fraction(state.c)*1000,0,1000);$('cSlider').setAttribute('aria-valuetext','c = '+fmt(state.c));
 $('showPlanner').checked=state.planner;$('showCandidates').checked=state.candidates;$('candidateLegend').hidden=!state.candidates;
 nodeButtons('welfareNodes',true);nodeButtons('betaNodes',false);
 syncPlotControls();
}
function syncPlotControls(){
 for(const group of plotClones)for(const target of group.querySelectorAll('[data-source-control]')){
  const source=$(target.dataset.sourceControl);
  if(target.tagName==='INPUT'){if(target.type!=='number'||document.activeElement!==target)target.value=source.value}
  else {target.innerHTML=source.innerHTML;if(source.hasAttribute('aria-label'))target.setAttribute('aria-label',source.getAttribute('aria-label'));if(source.title)target.title=source.title}
 }
}
function setupPlotControls(){
 const original=document.querySelector('.controls');original.classList.add('plot-controls');original.dataset.plotControls='welfare';original.setAttribute('aria-label','Welfare parameters');
 original.querySelector('label[for="bNumber"]').innerHTML='<span class="math">b</span>';original.querySelector('label[for="bNumber"]').title='Preference productivity';
 original.querySelector('label[for="cNumber"]').innerHTML='<span class="math">c</span>';original.querySelector('label[for="cNumber"]').title='Learning cost';
 $('play').textContent='▶';$('play').title='Play c increase';$('play').setAttribute('aria-label','Play c increase');$('resetC').textContent='↺';$('resetC').title='Reset c to low cost';$('resetC').setAttribute('aria-label','Reset c to low cost');
 document.querySelector('.figure').prepend(original);
 for(const [scope,container]of[['beta',document.querySelectorAll('.figure')[1]],['phase',document.querySelector('.phase-figure')]]){
  const clone=original.cloneNode(true);clone.dataset.plotControls=scope;clone.setAttribute('aria-label',scope==='beta'?'Manipulation parameters':'Equilibrium region parameters');
  for(const el of clone.querySelectorAll('[id]')){const sourceId=el.id;el.dataset.sourceControl=sourceId;el.id=sourceId+'_'+scope;if(el.tagName==='INPUT'){const eventName=el.type==='range'?'input':'change';el.addEventListener(eventName,()=>{const source=$(sourceId);source.value=el.value;source.dispatchEvent(new Event(eventName,{bubbles:true}));el.value=source.value;syncPlotControls()})}else if(el.tagName==='BUTTON')el.addEventListener('click',()=>{$(sourceId).click();syncPlotControls()})}
  for(const label of clone.querySelectorAll('label[for]'))label.htmlFor=label.htmlFor+'_'+scope;
  container.prepend(clone);plotClones.push(clone);
 }
 syncPlotControls();
}
function render(){if(dirty){regenerate();dirty=false}renderControls();drawWelfare();drawBeta();drawPhase()}
for(const[key,min,max]of[['b',.02,2],['tau',.2,3],['mu',.02,2]]){
 $(key+'Slider').addEventListener('input',ev=>setParameters({[key]:Number(ev.target.value)}));
 $(key+'Number').addEventListener('change',ev=>{const v=Number(ev.target.value);if(ev.target.value===''||!Number.isFinite(v)||v<min||v>max){$('inputError').textContent=key+': '+min+'–'+max;ev.target.value=fmt(state[key],5);return}setParameters({[key]:v})});
}
$('cSlider').addEventListener('input',ev=>{stopPlay();state.c=cAt(Number(ev.target.value)/1000);requestRender()});
$('cNumber').addEventListener('change',ev=>{const c=Number(ev.target.value);if(!Number.isFinite(c)||c<1e-12||c>1e6){$('inputError').textContent='c: 10⁻¹²–10⁶';ev.target.value=fmt(state.c,5);return}setParameters({c})});
$('exampleSelect').addEventListener('change',ev=>{if(!ev.target.value)return;const b=ev.target.value==='knife'?.25:Number(ev.target.value),z=Model.context(b,1,.25);setParameters({b,tau:1,mu:.25,c:z.star?Math.sqrt(z.activation*z.star):z.activation*.65});ev.target.value=''});
$('showPlanner').addEventListener('change',ev=>{state.planner=ev.target.checked;requestRender()});
$('showCandidates').addEventListener('change',ev=>{state.candidates=ev.target.checked;requestRender()});
for(const id of['welfareNodes','betaNodes'])$(id).addEventListener('click',ev=>{const button=ev.target.closest('[data-cost]');if(button)setParameters({c:Number(button.dataset.cost)})});
$('resetC').addEventListener('click',()=>setParameters({c:windowFor(q).lo}));
$('play').addEventListener('click',()=>{if(playing){stopPlay();return}playFraction=fraction(state.c);if(playFraction>.985){playFraction=0;state.c=domain.lo}playing=true;lastTime=0;$('play').textContent='Ⅱ';$('play').title='Pause';$('play').setAttribute('aria-label','Pause');syncPlotControls();requestAnimationFrame(animate)});
function animate(t){if(!playing)return;if(!lastTime)lastTime=t;playFraction=Math.min(1,playFraction+(t-lastTime)/16000);lastTime=t;state.c=cAt(playFraction);requestRender();if(playFraction>=1)stopPlay();else requestAnimationFrame(animate)}
function tooltip(id,ev,content){const tip=$(id),rect=tip.parentElement.getBoundingClientRect();tip.hidden=false;tip.innerHTML=content;tip.style.left=clamp(ev.clientX-rect.left+10,0,Math.max(0,rect.width-tip.offsetWidth))+'px';tip.style.top=clamp(ev.clientY-rect.top+15,0,rect.height-tip.offsetHeight)+'px'}
for(const id of['welfareChart','betaChart']){
 const el=$(id),tip=id==='welfareChart'?'welfareTip':'betaTip';let dragging=false;
 function costAtPointer(ev){const rect=el.getBoundingClientRect();return cAt(clamp((ev.clientX-rect.left-Number(el.dataset.left))/Number(el.dataset.plotwidth),0,1))}
 function move(ev){state.c=costAtPointer(ev);stopPlay();requestRender()}
 el.addEventListener('pointerdown',ev=>{dragging=true;el.setPointerCapture(ev.pointerId);const c=costAtPointer(ev),u=fraction(c),z=thresholds(id==='welfareChart').find(z=>Math.abs(fraction(z.c)-u)*Number(el.dataset.plotwidth)<8);if(z){state.c=z.c;stopPlay();requestRender()}else move(ev)});
 el.addEventListener('pointermove',ev=>{if(dragging)move(ev);const c=costAtPointer(ev),e=Model.equilibrium(c,q),z=thresholds(id==='welfareChart').find(z=>Math.abs(fraction(z.c)-fraction(c))*Number(el.dataset.plotwidth)<9);tooltip(tip,ev,z?'<strong>'+z.symbol+' · '+z.meaning+'</strong><br>c = '+fmt(z.c,6):'c = '+fmt(c)+' · '+names[e.regime]+'<br>'+(id==='welfareChart'?'Wᵈ − W₀ = '+fmt(e.W-q.W0):'βᵈ = '+fmt(e.beta)))});
 el.addEventListener('pointerup',()=>dragging=false);el.addEventListener('pointercancel',()=>dragging=false);el.addEventListener('pointerleave',()=>$(tip).hidden=true);
 el.addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight'].includes(ev.key))return;ev.preventDefault();stopPlay();state.c=cAt(clamp(fraction(state.c)+(ev.key==='ArrowRight'?.01:-.01),0,1));requestRender()});
}
{
 const el=$('phaseChart');let dragging=false,dragDomain;
 function point(ev,d){const r=el.getBoundingClientRect(),u=clamp((ev.clientX-r.left-Number(el.dataset.left))/Number(el.dataset.plotwidth),0,1),v=clamp((ev.clientY-r.top-Number(el.dataset.top))/Number(el.dataset.plotheight),0,1);return {b:.02+1.98*u,c:cAt(1-v,d)}}
 el.addEventListener('pointerdown',ev=>{dragging=true;dragDomain=phaseWindow();el.setPointerCapture(ev.pointerId);setParameters(point(ev,dragDomain))});
 el.addEventListener('pointermove',ev=>{const p=point(ev,dragging?dragDomain:phaseWindow());if(dragging)setParameters(p);const z=Model.context(p.b,state.tau,state.mu),e=Model.equilibrium(p.c,z);tooltip('phaseTip',ev,names[e.regime]+'<br>b = '+fmt(p.b)+' · c = '+fmt(p.c))});
 el.addEventListener('pointerup',()=>dragging=false);el.addEventListener('pointercancel',()=>dragging=false);el.addEventListener('pointerleave',()=>$('phaseTip').hidden=true);
 el.addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key))return;ev.preventDefault();setParameters({b:clamp(state.b+(ev.key==='ArrowRight'?.01:ev.key==='ArrowLeft'?-.01:0),.02,2),c:clamp(state.c*(ev.key==='ArrowUp'?1.05:ev.key==='ArrowDown'?1/1.05:1),1e-12,1e6)})});
}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>requestRender(),80)});
setupPlotControls();
window.WelfareExplorer={Model,state,get context(){return q},setParameters};
if(document.modelContext?.registerTool){try{const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});Promise.resolve(document.modelContext.registerTool({name:'configure_welfare_parameters',title:'调整福利比较静态参数',description:'调整网页中的 b、c、tau、mu 并返回分散均衡及规划者福利。',inputSchema:{type:'object',properties:{b:{type:'number',minimum:.02,maximum:2},c:{type:'number',minimum:1e-12,maximum:1e6},tau:{type:'number',minimum:.2,maximum:3},mu:{type:'number',minimum:.02,maximum:2}},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!input||typeof input!=='object'||Array.isArray(input))throw new Error('需要参数对象');const ranges={b:[.02,2],c:[1e-12,1e6],tau:[.2,3],mu:[.02,2]};for(const[k,v]of Object.entries(input)){if(!ranges[k]||!Number.isFinite(v)||v<ranges[k][0]||v>ranges[k][1])throw new Error('参数超出允许范围：'+k)}setParameters(input);await new Promise(requestAnimationFrame);const z=Model.context(state.b,state.tau,state.mu),e=Model.equilibrium(state.c,z),p=Model.planner(state.c,z);return {parameters:{...state},regime:names[e.regime],beta:e.beta,Ktheta:e.kt,Kmu:e.km,W:e.W,Wso:p.W,W0:z.W0}}},{signal:lifecycle.signal})).catch(()=>{})}catch(_){}}

render();
